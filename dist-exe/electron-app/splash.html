<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>DeepSeek Harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 40%, #16213e 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 32px;
    }

    .logo-ring {
      position: absolute;
      inset: 0;
      border: 3px solid transparent;
      border-top-color: #4f7df9;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }

    .logo-ring:nth-child(2) {
      inset: 12px;
      border-top-color: #7c5bf5;
      animation-duration: 1.5s;
      animation-direction: reverse;
    }

    .logo-ring:nth-child(3) {
      inset: 24px;
      border-top-color: #a855f7;
      animation-duration: 2s;
    }

    .logo-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #4f7df9, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #4f7df9, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status {
      font-size: 14px;
      color: #8892b0;
      letter-spacing: 0.5px;
      animation: pulse 2s ease-in-out infinite;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-ring"></div>
    <div class="logo-ring"></div>
    <div class="logo-ring"></div>
    <div class="logo-text">DSH</div>
  </div>
  <h1>DeepSeek Harness</h1>
  <p class="status">Запуск сервера<span class="dots"></span></p>
</body>
</html>
